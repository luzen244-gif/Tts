
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          mkdir -p src

          ZIP=$(find . -maxdepth 1 -iname "*.zip" -type f | head -1)

          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d src
          fi

          PROJECT=$(find . -type f -name "*.csproj" \
            -not -path "./.git/*" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "Projeto .csproj não encontrado!"
            exit 1
          fi

          echo "CSPROJ=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT"

      - name: Instalar MAUI Android
        run: dotnet workload install maui-android

      - name: Restaurar dependências
        run: dotnet restore "$CSPROJ"

      - name: Compilar APK
        run: |
          dotnet publish "$CSPROJ" \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false

      - name: Localizar APK
        run: |
          mkdir -p output

          find . -type f -name "*.apk" \
            -not -path "./output/*" \
            -not -path "./.git/*" \
            -exec cp {} output/ \;

          test -n "$(find output -name '*.apk' -print -quit)"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: LuzenMapper-APK
          path: output/*.apk
          if-no-files-found: error
          
