
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar LzKeyMap
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Instalar MAUI Android
        run: dotnet workload install maui-android

      - name: Restaurar projeto
        run: dotnet restore LzKeyMap.csproj

      - name: Compilar APK
        run: |
          dotnet publish LzKeyMap.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:PublishTrimmed=true

      - name: Localizar APK
        run: |
          mkdir -p output
          find . -type f -name "*.apk" \
            -not -path "./output/*" \
            -exec cp {} output/ \;
          test -n "$(find output -name '*.apk' -print -quit)"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LzKeyMap-APK
          path: output/*.apk
          if-no-files-found: error
          
